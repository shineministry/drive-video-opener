<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Sound of Music">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e6fb7"/>
      <stop offset="1" stop-color="#8fc3ec"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa65b"/>
      <stop offset="1" stop-color="#2f7a3f"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8a4b"/>
      <stop offset="1" stop-color="#1f5c2e"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="47" cy="16" r="7" fill="#ffe9a8" opacity=".95"/>

  <!-- far hill -->
  <path d="M0 40 Q14 24 30 34 Q46 44 64 28 V64 H0 Z" fill="url(#hillA)"/>
  <!-- near hill -->
  <path d="M0 52 Q18 40 36 50 Q50 57 64 46 V64 H0 Z" fill="url(#hillB)"/>

  <!-- music note -->
  <g fill="#ffffff" stroke="#16324a" stroke-width="1.6" stroke-linejoin="round">
    <path d="M40 12 l10 -3 v5 l-10 3 z"/>
    <rect x="38.4" y="14" width="3.2" height="20" rx="1.4"/>
    <ellipse cx="34.6" cy="34.4" rx="6.2" ry="4.8" transform="rotate(-16 34.6 34.4)"/>
  </g>
</svg>
