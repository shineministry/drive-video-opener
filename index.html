<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sound of Music (1965)</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;outline:none}
  video::cue{background:rgba(0,0,0,.72);color:#fff;font-size:1.05em;text-shadow:0 1px 2px #000}
  #fallback{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:24px;text-align:center;background:#000;color:#9aa0a6;
    font:15px/1.6 "Segoe UI",Roboto,Arial,sans-serif}
  #fallback b{color:#e8eaed;font-size:18px;font-weight:500}
  #fallback code{background:#1f1f1f;color:#8ab4f8;padding:4px 8px;border-radius:5px;font-size:13px}
  #sound{position:fixed;top:20px;left:20px;display:flex;align-items:center;gap:9px;height:42px;padding:0 18px;
    border:0;border-radius:21px;cursor:pointer;background:rgba(255,255,255,.92);color:#202124;z-index:5;
    font:500 14px "Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  #sound:hover{background:#fff}
  #sound.gone{display:none}
  #sound svg{width:18px;height:18px;fill:currentColor}
  #toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%) translateY(10px);
    background:rgba(32,33,36,.92);color:#e8eaed;padding:11px 20px;border-radius:9px;
    font:500 14px "Segoe UI",Roboto,Arial,sans-serif;opacity:0;pointer-events:none;
    transition:opacity .35s,transform .35s;z-index:6;box-shadow:0 1px 8px rgba(0,0,0,.55)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #crest{position:fixed;top:16px;right:18px;width:min(230px,26vw);height:auto;
    opacity:.5;                      /* 50% transparent watermark */
    pointer-events:none;             /* clicks pass through to the video */
    z-index:4;filter:drop-shadow(0 1px 4px rgba(0,0,0,.45))}
  #ctrls{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;
    padding:28px 18px 13px;background:linear-gradient(transparent,rgba(0,0,0,.78));
    transition:opacity .3s;opacity:1}
  #ctrls.hide{opacity:0;pointer-events:none}
  #ctrls button{background:none;border:0;color:#fff;cursor:pointer;padding:7px;border-radius:7px;
    display:flex;line-height:0}
  #ctrls button:hover{background:rgba(255,255,255,.16)}
  #ctrls svg{width:22px;height:22px;fill:#fff}
  #btnCc{font:700 12px/1 "Segoe UI",Arial,sans-serif;padding:10px 7px;color:#cfd2d6}
  #btnCc.on{color:#8ab4f8;background:rgba(138,180,248,.16)}
  #seek{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;outline:none;
    cursor:pointer;background:rgba(255,255,255,.28)}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border:0;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  #seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
  #tCur,#tDur{font:500 13px "Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-shadow:0 1px 2px #000;
    font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
  #tDur{color:#cfd2d6}
</style>
</head>
<body>

<video id="v" autoplay playsinline preload="auto">
  <source src="video_hd.mp4" type="video/mp4">
  <source src="../../The.Sound.of.Music.%20(1965)%20%5B580p%5D.mp4" type="video/mp4">
  <source src="video.mp4" type="video/mp4">
  <track kind="subtitles" src="subtitles.vtt" srclang="en" label="English" default>
</video>

<img id="crest" src="crest-logo.png" alt="Shineil Mathias crest">

<div id="ctrls">
  <button id="btnPlay" title="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <span id="tCur">0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <span id="tDur">0:00</span>
  <button id="btnCc" title="Subtitles">CC</button>
  <button id="btnFs" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
</div>

<div id="fallback">
  <b>Video not available here</b>
  <span>Open this page on the computer where the video file lives,<br>
        or start it with a hosted URL:</span>
  <code>index.html?v=https://example.com/your-video.mp4</code>
</div>

<button id="sound" title="Turn on sound">
  <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
  <span id="soundtxt">Tap for sound</span>
</button>

<script>
const v=document.getElementById('v'),
      fb=document.getElementById('fallback'),
      pill=document.getElementById('sound'),
      pillTxt=document.getElementById('soundtxt');

/* 1) ?v=<url> overrides the built-in local paths (used for online hosting).
   Setting the src attribute takes precedence over the <source> children, and
   keeps the <track> element so subtitles still work for hosted videos. */
const q=new URLSearchParams(location.search).get('v');
const isRemote=!!(q && /^(https?:)?\/\//i.test(q) && !q.startsWith(location.origin));
/* Remote load stages:
   0 = direct fetch, CORS-clean (best — no relay traffic) … needs the bucket's
       CORS policy to exist; fails fast without it
   1 = same-origin relay (/proxy?u=…) — the response counts as same-origin, so
       Web Audio may legally apply the4x boost AND seeking keeps working,
       with no dashboard/CORS dependency
   2 = direct plain fetch — last resort: normal volume, never silenced */
const BASE=location.pathname.replace(/\/[^\/]*$/,'');   // '' at domain root, '/drive-video-opener' on project Pages
const PROXY=BASE+'/proxy?u='+encodeURIComponent(q||'');
let stage=q?(isRemote?0:-1): -1;      // -1 = local/same-origin source, nothing to retry
function applySrc(){
  if(!q) return;
  if(stage===0){ v.crossOrigin='anonymous'; v.src=q; return; }
  if(stage===1){ v.removeAttribute('crossorigin'); v.src=PROXY; return; }
  v.removeAttribute('crossorigin'); v.src=q;          // plain direct (stage 2 / same-origin ?v=)
}
if(q) applySrc();

/* ---- sound: never muted ----
   The video element never gets muted. Unmuted autoplay is attempted directly;
   if the browser's autoplay policy blocks it, nothing starts until the first
   tap (never silently). */

/* ---- boosted audio ----
   Browsers cap element volume at 1.0, so the extra loudness comes from a Web
   Audio graph: GainNode at4x + a DynamicsCompressor acting as a limiter, so
   the4x gain is loud without hard-clipping into distortion. The graph is only
   attached once the AudioContext is running (attaching to a suspended context
   would silence the element) and — for direct remote videos — only after the
   media has provably loaded CORS-clean (stage1 relay responses are
   same-origin, so they are safe immediately). */
const BOOST = 4.0;                 // 4.0 = 400% / four times the volume
const AC = window.AudioContext || window.webkitAudioContext;
let actx=null, gain=null, attached=false;

function boostAllowed(){
  if(stage===2) return false;       // plain cross-origin fallback: boosting it would silence it
  return true;                      // local files, same-origin, CORS-clean load, relay load
}
function attachBoost(){
  if(attached || !boostAllowed() || !actx || actx.state!=='running') return;
  if(stage===0 && isRemote && !(v.crossOrigin==='anonymous' && v.readyState>=1)) return; // wait for CORS load proof
  try{
    const src=actx.createMediaElementSource(v);
    gain=actx.createGain();
    gain.gain.value=BOOST;          // the actual4x
    // limiter: absorbs the peaks the4x gain would otherwise hard-clip
    const limiter=actx.createDynamicsCompressor();
    limiter.threshold.value=-6;
    limiter.knee.value=4;
    limiter.ratio.value=12;
    limiter.attack.value=0.002;
    limiter.release.value=0.2;
    src.connect(gain); gain.connect(limiter); limiter.connect(actx.destination);
    attached=true;
    window.__audio={actx,gain,limiter,src,BOOST};
  }catch(e){ /* leave native audio untouched */ }
  syncPill();
}
function ensureContext(){
  if(!boostAllowed() || !AC || attached) return;
  if(!actx){ try{ actx=new AC(); }catch(e){ return; } }
  if(actx.state==='running'){ attachBoost(); return; }
  actx.resume().then(attachBoost).catch(()=>{});   // retry on gesture below
}

/* attempt unmuted autoplay right away (allowed when the browser grants it) */
v.play().catch(()=>{ /* blocked: video stays paused on its first frame, sound on tap */ });
ensureContext();                                    // boost starts immediately if permitted
v.addEventListener('loadedmetadata',attachBoost);   // remote: attach once CORS load is proven

/* first tap anywhere: (re)attach the boost. Starting playback is handled by
   the picture's own click handler and the play button, so a tap on the video
   toggles play/pause instead of always starting. */
document.addEventListener('pointerdown',()=>{
  ensureContext();
},{capture:true});
v.addEventListener('volumechange',()=>{
  if(!v.muted) ensureContext();
});

/* pill: shown until playback + boost are both active (or boost can never
   apply, e.g. after a CORS fallback) */
function syncPill(){
  const noBoostEver = stage===2;    // plain fallback: boost can never attach there
  const ok = !v.paused && (attached || noBoostEver);
  pill.classList.toggle('gone', ok);
  pillTxt.textContent = v.paused ? 'Tap for sound' : 'Tap for 4\u00d7 volume';
}
pill.addEventListener('click',e=>{
  e.stopPropagation();
  if(v.paused) v.play().catch(()=>{});
  ensureContext();
});
['play','playing','pause'].forEach(ev=>v.addEventListener(ev,syncPill));
syncPill();

/* ---- continue system: remember where the viewer stopped, resume there ----
   Position is stored in localStorage keyed by the video source, so the movie
   picks up where the user left off in a past session (per browser/device).
   It saves periodically while playing + on pause/unload, and forgets the
   position once the movie is finished (or nearly: last 45 s = "done"). */
const RESUME_KEY='tsom-pos-v1';
const MIN_RESUME=15;        // ignore the first seconds (accidental closes)
const NEAR_END=45;          // < this much left = treat as finished
function srcKey(){ return v.currentSrc || q || 'default'; }
function readPos(){
  try{
    const all=JSON.parse(localStorage.getItem(RESUME_KEY)||'{}');
    const e=all[srcKey()];
    return (e && typeof e.t==='number' && isFinite(e.t)) ? e.t : 0;
  }catch(e){ return 0; }
}
function writePos(t){
  try{
    const all=JSON.parse(localStorage.getItem(RESUME_KEY)||'{}');
    all[srcKey()]={t:t,at:Date.now()};
    // keep storage small: drop entries older than 6 months
    for(const k in all){ if(Date.now()-(all[k].at||0)>15552e6) delete all[k]; }
    localStorage.setItem(RESUME_KEY,JSON.stringify(all));
  }catch(e){}              // storage disabled/full: player still works, no resume
}
function forgetPos(){
  try{
    const all=JSON.parse(localStorage.getItem(RESUME_KEY)||'{}');
    delete all[srcKey()];
    localStorage.setItem(RESUME_KEY,JSON.stringify(all));
  }catch(e){}
}

const toastEl=document.createElement('div');
toastEl.id='toast';
document.body.appendChild(toastEl);
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),4000);
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  const mm=h?String(m).padStart(2,'0'):String(m);
  return (h?h+':':'')+mm+':'+String(s).padStart(2,'0');
}

let resumeDone=false;        // position restored at most once per load
function tryResume(){
  if(resumeDone || v.readyState<1 || !isFinite(v.duration)) return;
  resumeDone=true;
  const t=readPos();
  if(t>MIN_RESUME && t < v.duration-NEAR_END){
    try{
      v.currentTime=t;
      toast('Continuing from '+fmtTime(t));
    }catch(e){}             // seek before data: ignore, start at 0
  }
}
v.addEventListener('loadedmetadata',tryResume);
v.addEventListener('durationchange',tryResume);

let lastSaved=0;
v.addEventListener('timeupdate',()=>{
  if(v.paused || v.seeking || v.ended) return;
  const now=Date.now();
  if(now-lastSaved>5000){ lastSaved=now; if(v.currentTime>MIN_RESUME) writePos(v.currentTime); }
});
function saveNow(){
  if(resumeDone && v.readyState>=1 && v.currentTime>MIN_RESUME &&
     (!isFinite(v.duration) || v.currentTime < v.duration-NEAR_END)) writePos(v.currentTime);
}
v.addEventListener('pause',saveNow);                       // user hit pause
window.addEventListener('pagehide',saveNow);               // closed/refreshed the tab
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNow(); });
v.addEventListener('ended',()=>forgetPos());               // finished: start over next time

/* if no source could be loaded at all -> show the notice instead of a dead
   player; a failed stage advances the chain: CORS attempt -> same-origin
   relay -> plain direct fetch (last resort, normal volume, never silent) */
let retrying=false;
function handleMediaError(){
  if(isRemote && stage<2){
    stage++; retrying=true;
    applySrc();                    // re-run resource selection with the next source
    v.play().catch(()=>{});
    return true;
  }
  return false;
}
v.addEventListener('error',()=>{ if(!handleMediaError()) show(); });
const poll=setInterval(()=>{
  if(v.readyState>0){ clearInterval(poll); return; }              // started fine
  if(retrying) return;                                            // plain retry in flight
  if(v.error || v.networkState===3){                              // nothing to load
    if(!handleMediaError()){ clearInterval(poll); show(); }
  }
},600);
function show(){ v.style.display='none'; pill.style.display='none'; ctrls.style.display='none'; fb.style.display='flex'; clearInterval(poll); }

/* space = play/pause. Capture phase + stopPropagation so the video's own
   focused controls can't also handle the key (double-toggle = "nothing
   happens"); preventDefault stops page scroll and button activation.
   Runs even in fullscreen. */
document.addEventListener('keydown',e=>{
  if(e.code!=='Space' || e.repeat) return;
  if(fb.style.display==='flex') return;                 // fallback screen: no video
  e.preventDefault();
  e.stopPropagation();
  if(v.paused) v.play().catch(()=>{}); else v.pause();
},true);

/* ---- fullscreen ----
   Fullscreening the bare <video> paints everything OUTSIDE it behind the
   top layer, so the watermark (and pill/toast) would disappear. So whenever
   anything other than the page itself is fullscreened, switch the fullscreen
   target to <html> in one step — requesting a new element REPLACES the old
   one, so there is no exit/re-enter gap that can fail and leave the user
   without fullscreen. The fixed video fills the page exactly: same picture.
   F = toggle fullscreen (works in normal view and while fullscreened). */
function pageFullscreen(){
  const root=document.documentElement;
  if(typeof root.requestFullscreen!=='function') return;  // e.g. iOS Safari: video-only fullscreen
  try{ root.requestFullscreen().catch(()=>{}); }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
  const fe=document.fullscreenElement;
  if(!fe || fe===document.documentElement || fe===document.body) return;
  pageFullscreen();                                       // replaces the element fullscreen in place
});
document.addEventListener('keydown',e=>{
  if(e.code!=='KeyF' || e.repeat) return;
  if(fb.style.display==='flex') return;
  e.preventDefault();
  e.stopPropagation();
  if(document.fullscreenElement){ try{ document.exitFullscreen().catch(()=>{}); }catch(e){} }
  else pageFullscreen();
},true);

/* ---- custom control bar ----
   The native controls were removed because their "⋮" menu exposes a
   Download item we cannot switch off (and right-click "Save video as…" is a
   browser menu). This bar keeps everything else the player needs —
   play/pause, seek, time, subtitles on/off, fullscreen — and nothing that
   offers a download. It hides itself after a few idle seconds while playing
   and comes back on mouse move / tap. */
const ctrls=document.getElementById('ctrls'),
      btnPlay=document.getElementById('btnPlay'),
      seek=document.getElementById('seek'),
      tCur=document.getElementById('tCur'),
      tDur=document.getElementById('tDur'),
      btnCc=document.getElementById('btnCc'),
      btnFs=document.getElementById('btnFs');
const ICON_PLAY='M8 5v14l11-7z',
      ICON_PAUSE='M6 19h4V5H6v14zm8-14v14h4V5h-4z',
      ICON_FS='M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z',
      ICON_FS_EXIT='M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';
let scrubbing=false, hideTimer=null;

function fmtClock(sec){ return isFinite(sec)&&sec>=0?fmtTime(sec):'0:00'; }
function syncCtrls(){
  btnPlay.innerHTML='<svg viewBox="0 0 24 24"><path d="'+(v.paused?ICON_PLAY:ICON_PAUSE)+'"/></svg>';
  btnPlay.title=v.paused?'Play':'Pause';
  btnFs.innerHTML='<svg viewBox="0 0 24 24"><path d="'+(document.fullscreenElement?ICON_FS_EXIT:ICON_FS)+'"/></svg>';
}
function showCtrls(){
  ctrls.classList.remove('hide');
  clearTimeout(hideTimer);
  if(!v.paused) hideTimer=setTimeout(()=>ctrls.classList.add('hide'),2600);
}
function togglePlay(){ v.paused?v.play().catch(()=>{}):v.pause(); showCtrls(); }

btnPlay.addEventListener('click',togglePlay);
v.addEventListener('click',togglePlay);          // click the picture = play/pause
document.addEventListener('mousemove',showCtrls);
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,showCtrls,{capture:true}));
['play','pause','playing','ended'].forEach(ev=>v.addEventListener(ev,()=>{ syncCtrls(); showCtrls(); }));
document.addEventListener('fullscreenchange',()=>{ syncCtrls(); showCtrls(); });

seek.addEventListener('input',()=>{
  scrubbing=true;
  if(isFinite(v.duration)&&v.duration>0){
    const t=seek.value/1000*v.duration;
    tCur.textContent=fmtClock(t);
    v.currentTime=t;
  }
});
seek.addEventListener('change',()=>{ scrubbing=false; });
v.addEventListener('timeupdate',()=>{
  if(scrubbing||!isFinite(v.duration)||v.duration<=0) return;
  seek.value=Math.round(v.currentTime/v.duration*1000);
  tCur.textContent=fmtClock(v.currentTime);
});
v.addEventListener('loadedmetadata',()=>{
  tDur.textContent=fmtClock(v.duration);
  const tt=v.textTracks&&v.textTracks[0];
  btnCc.classList.toggle('on',!!(tt&&tt.mode==='showing'));
});
btnCc.addEventListener('click',()=>{
  const tt=v.textTracks&&v.textTracks[0];
  if(!tt) return;
  const showing=tt.mode==='showing';
  tt.mode=showing?'disabled':'showing';
  btnCc.classList.toggle('on',!showing);
});
btnFs.addEventListener('click',()=>{
  if(document.fullscreenElement){ try{ document.exitFullscreen().catch(()=>{}); }catch(e){} }
  else pageFullscreen();
  showCtrls();
});

/* no right-click "Save video as…" on the picture */
v.addEventListener('contextmenu',e=>e.preventDefault());

syncCtrls(); showCtrls();
</script>
</body>
</html>
