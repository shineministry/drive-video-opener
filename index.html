<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 87.3 78'%3E%3Cpath d='m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z' fill='%230066da'/%3E%3Cpath d='m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z' fill='%2300ac47'/%3E%3Cpath d='m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z' fill='%23ea4335'/%3E%3Cpath d='m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z' fill='%2300832d'/%3E%3Cpath d='m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z' fill='%232684fc'/%3E%3Cpath d='m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z' fill='%23ffba00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--txt:#1f1f1f;--mut:#5f6368;--bd:#e8eaed;--hov:#f1f3f4;--blue:#0b57d0;--blue2:#1a73e8;--sel:#e8f0fe;--tonal:#d3e3fd;--hdr:64px;--side:256px}
html,body{height:100%}
body{font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif;color:var(--txt);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#dadce0;border:3px solid #fff;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#bdc1c6}
::-webkit-scrollbar-track{background:transparent}

/* ---------- video opener ---------- */
#opener{position:fixed;inset:0;z-index:9999;background:#000;opacity:1;transition:opacity .55s ease}
#opener.hide{opacity:0;pointer-events:none}
#opener.gone{display:none}
#openerVideo{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.op-chip{position:absolute;top:22px;left:22px;display:flex;align-items:center;gap:11px;padding:9px 18px 9px 13px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:15px;font-weight:500;letter-spacing:.2px;pointer-events:none}
.op-chip svg{width:24px;height:22px}
.op-btn{position:absolute;bottom:30px;display:flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.94);color:#202124;font-size:15px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:.15s}
.op-btn:hover{background:#fff;transform:translateY(-1px)}
.op-btn svg{width:20px;height:20px;fill:currentColor}
#skipBtn{right:30px}
#soundBtn{left:30px;width:46px;padding:0}
#opBar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.22)}
#opBar i{display:block;height:100%;width:0;background:var(--blue2);transition:width .25s linear}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:#fff;display:flex;align-items:center;gap:6px;padding:0 16px 0 12px;z-index:100}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none;transition:background .12s}
.ibtn:hover{background:var(--hov)}
.ibtn svg{width:24px;height:24px;fill:currentColor}
#logo{display:flex;align-items:center;padding:6px 8px;flex:none}
#logo svg{width:29px;height:26px}
.search{flex:1;max-width:720px;height:48px;margin:0 10px;display:flex;align-items:center;gap:15px;background:var(--hov);border-radius:24px;padding:0 10px 0 16px;transition:box-shadow .15s,background .15s;color:var(--mut)}
.search:hover{background:#e9eaed}
.search:focus-within{background:#fff;box-shadow:0 1px 6px rgba(32,33,36,.28)}
.search>svg{width:22px;height:22px;fill:currentColor;flex:none}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--txt);min-width:0}
.search input::placeholder{color:var(--mut)}
#clearBtn{display:none}
#clearBtn.on{display:flex}
.tb-right{display:flex;align-items:center;gap:2px;margin-left:auto}
#avatarBtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:6px;flex:none}
#avatarBtn:hover{background:var(--hov)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1a73e8,#0d55c4);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:500}

/* ---------- sidebar ---------- */
#side{position:fixed;top:var(--hdr);left:0;bottom:0;width:var(--side);background:#fff;padding:6px 12px 18px;display:flex;flex-direction:column;z-index:90;overflow-y:auto}
#newBtn{display:flex;align-items:center;gap:13px;height:50px;padding:0 22px 0 16px;border-radius:25px;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);font-size:15px;font-weight:500;color:#3c4043;align-self:flex-start;margin:6px 0 14px;transition:background .12s,box-shadow .12s}
#newBtn:hover{background:#f8f9fa;box-shadow:0 1px 3px rgba(60,64,67,.35),0 2px 6px 2px rgba(60,64,67,.18)}
#newBtn svg{width:24px;height:24px;fill:#5f6368}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:18px;height:40px;padding:0 14px;border-radius:20px;font-size:14px;color:#3c4043;width:100%;text-align:left;transition:background .12s}
.nav-item:hover{background:var(--hov)}
.nav-item.active{background:var(--tonal);color:var(--blue);font-weight:500}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex:none}
.storage{margin-top:auto;padding:16px 6px 0;border-top:1px solid var(--bd)}
.storage h4{font-size:14px;font-weight:500;margin-bottom:5px}
.storage p{font-size:12px;color:var(--mut);margin-bottom:9px}
.storage .bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden}
.storage .bar i{display:block;height:100%;width:27%;background:var(--blue2);border-radius:2px}
.storage a{display:inline-block;margin-top:12px;font-size:13px;color:var(--blue2);font-weight:500}
.storage a:hover{text-decoration:underline}
#drawerOv{display:none;position:fixed;inset:var(--hdr) 0 0 0;background:rgba(32,33,36,.4);z-index:85}

/* ---------- main ---------- */
#main{position:fixed;top:var(--hdr);left:var(--side);right:0;bottom:0;overflow-y:auto;padding:4px 28px 80px;background:#fff}
.main-head{position:sticky;top:0;background:#fff;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding-top:6px}
.view-title{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:500;cursor:pointer;border-radius:8px;padding:6px 8px;margin-left:-8px}
.view-title:hover{background:var(--hov)}
.view-title svg{width:20px;height:20px;fill:var(--mut)}
.head-actions{display:flex;align-items:center;gap:2px}
.head-actions .ibtn.on{background:var(--tonal);color:var(--blue)}
.sec-label{font-size:16px;font-weight:500;color:#3c4043;padding:10px 4px 12px}
.sug-row{display:flex;gap:16px;overflow-x:auto;padding:0 4px 22px}
.sug{flex:0 0 258px;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:box-shadow .13s,border-color .13s;text-align:left}
.sug:hover{box-shadow:0 1px 3px rgba(60,64,67,.28);border-color:#dadce0}
.sug .pv{height:138px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid var(--bd);position:relative;overflow:hidden}
.sug .pv svg.big{width:64px;height:64px}
.sug .nm{padding:11px 14px 3px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .mt{padding:0 14px 13px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* list view */
.list{padding:0 2px}
.lrow{display:grid;grid-template-columns:minmax(240px,1fr) 168px 146px 104px 44px;align-items:center;height:40px;padding:0 8px;border-radius:8px;font-size:14px;color:var(--mut)}
.lrow:hover{background:var(--hov)}
.lrow.sel{background:var(--sel)}
.lhead{position:sticky;top:56px;height:38px;font-size:12px;font-weight:500;color:var(--mut);border-bottom:1px solid var(--bd);border-radius:0;background:#fff;z-index:15;cursor:pointer}
.lhead:hover{background:none}
.lhead .c-name{display:flex;align-items:center;gap:6px}
.lhead svg{width:16px;height:16px;fill:var(--mut)}
.c-name{display:flex;align-items:center;gap:16px;min-width:0;color:var(--txt);font-size:16px}
.c-name>svg,.c-name .thumbmini{width:24px;height:24px;flex:none}
.c-name .fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name .star{width:15px!important;height:15px!important;fill:#f9ab00!important;flex:none}
.lrow .c-owner,.lrow .c-mod,.lrow .c-size{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;font-size:14px}
.lrow .c-act{display:flex;justify-content:flex-end;opacity:0}
.lrow:hover .c-act{opacity:1}
.lrow .c-act .ibtn{width:32px;height:32px}
.lrow .c-act .ibtn svg{width:20px;height:20px}
.thumbmini{border-radius:3px;display:flex;align-items:center;justify-content:center}
.thumbmini svg{width:14px;height:14px;fill:#fff}

/* grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:20px 16px;padding:4px 4px}
.gcard{text-align:left;cursor:pointer;border-radius:12px;padding:2px}
.gthumb{height:148px;border:1px solid var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;position:relative;transition:box-shadow .13s,background .13s}
.gcard:hover .gthumb{box-shadow:0 1px 3px rgba(60,64,67,.3);background:#fbfcfd}
.gcard.sel .gthumb{border-color:#aecbfa;background:#f5faff}
.gthumb svg.big{width:66px;height:66px}
.gname{display:flex;align-items:center;gap:6px;padding:10px 6px 2px;font-size:14px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname .star{width:14px;height:14px;fill:#f9ab00;flex:none}
.gmeta{padding:0 6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play svg{width:46px;height:46px;fill:rgba(255,255,255,.92);filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 0;color:var(--mut);font-size:15px}
.empty svg{width:72px;height:72px;fill:#dadce0}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:500;min-width:220px;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2),0 0 1px rgba(0,0,0,.2);padding:8px 0;display:none;animation:pop .12s ease}
.menu.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu .mi{display:flex;align-items:center;gap:16px;width:100%;padding:0 20px;height:40px;font-size:14px;color:#3c4043;text-align:left}
.menu .mi:hover{background:var(--hov)}
.menu .mi svg{width:20px;height:20px;fill:#5f6368;flex:none}
.menu .sep{height:1px;background:var(--bd);margin:8px 0}
.menu .mtitle{padding:6px 20px 8px;font-size:13px;color:var(--mut)}

/* ---------- details pane ---------- */
#details{position:fixed;top:var(--hdr);right:-320px;bottom:0;width:320px;background:#fff;border-left:1px solid var(--bd);z-index:80;transition:right .2s ease;padding:18px 22px;overflow-y:auto}
#details.on{right:0}
#details h3{font-size:16px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
#details .dt-close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
#details .dt-close:hover{background:var(--hov)}
#details .dt-close svg{width:20px;height:20px;fill:currentColor}
.dt-hero{display:flex;align-items:center;justify-content:center;height:150px;border:1px solid var(--bd);border-radius:12px;margin:14px 0 18px;overflow:hidden}
.dt-hero svg.big{width:64px;height:64px}
.dl{display:flex;flex-direction:column;gap:14px}
.dl .row{display:flex;flex-direction:column;gap:3px}
.dl .k{font-size:12px;color:var(--mut)}
.dl .v{font-size:14px;color:var(--txt)}

/* ---------- preview modal ---------- */
#modal{position:fixed;inset:0;background:rgba(32,33,36,.92);z-index:600;display:none;align-items:center;justify-content:center;padding:40px}
#modal.on{display:flex}
#modal .sheet{background:#fff;border-radius:12px;width:min(860px,100%);max-height:100%;overflow:auto;padding:0}
#modal .sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:500;gap:12px}
#modal .sheet-bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal .pv-big{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:44px;background:#fafbfc}
#modal .pv-big svg.big{width:110px;height:110px}
#modal .pv-big .hint{font-size:14px;color:var(--mut)}

/* ---------- snackbar ---------- */
#snack{position:fixed;left:50%;bottom:30px;transform:translate(-50%,80px);background:#3c4043;color:#fff;font-size:14px;padding:14px 22px;border-radius:6px;z-index:900;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
#snack.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){
  #side{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.15)}
  #side.open{transform:none}
  #drawerOv.on{display:block}
  #main{left:0}
  .lrow{grid-template-columns:minmax(160px,1fr) 130px 44px}
  .c-owner,.c-size{display:none}
  .lhead .c-owner,.lhead .c-size{display:none}
  #details{width:min(320px,90vw)}
}
</style>
</head>

<div id="opener">
  <video id="openerVideo" muted autoplay playsinline preload="auto">
    <source src="opener.local.mp4" type="video/mp4">
    <source src="assets/opener.mp4" type="video/mp4">
  </video>
  <div class="op-chip">
    <svg viewBox="0 0 87.3 78"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
    Drive
  </div>
  <button class="op-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">
    <svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>

  <button class="op-btn" id="skipBtn">Skip intro
    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </button>
  <div id="opBar"><i></i></div>
</div>

<!-- ============ TOP BAR ============ -->
<header id="top">
  <button class="ibtn" id="menuBtn" title="Main menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <a id="logo" href="#" title="Drive">
    <svg viewBox="0 0 87.3 78"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" placeholder="Search in Drive" autocomplete="off" spellcheck="false">
    <button class="ibtn" id="clearBtn" title="Clear search"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    <button class="ibtn" id="micBtn" title="Search by voice"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  </div>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function endOpener(){ if(opDone) return; opDone=true; try{ov.pause()}catch(e){}; op.classList.add("hide"); setTimeout(()=>op.classList.add("gone"),600); }
if(params.has("nointro")){ op.classList.add("gone"); opDone=true; }
else{
  const custom=params.get("video");
  if(custom){ ov.innerHTML=""; ov.src=custom; }
  ov.addEventListener("ended",endOpener);
  ov.addEventListener("error",endOpener); // all sources failed -> show the app
  ov.addEventListener("loadeddata",()=>{ ov.play().catch(()=>{}); });
  setTimeout(()=>{ if(!opDone && ov.readyState===0) endOpener(); },8000);
  ov.addEventListener("timeupdate",()=>{ if(ov.duration) opBar.style.width=(ov.currentTime/ov.duration*100)+"%"; });
}
$("#skipBtn").addEventListener("click",endOpener);

});

  text:{icon:page('#5f6368','<path d="M7.5 11.5h9v1.5h-9zm0 3h9v1.5h-9zm0 3h6v1.5h-6z" fill="#5f6368"/>'),color:'#5f6368',label:'Text file'},
  audio:{icon:page('#f29900','<path d="M12.5 11v6.1a2.2 2.2 0 1 0 1.6 2.1V13.4l3.4-.9V9.5l-5 1.3z" fill="#f29900"/>'),color:'#f29900',label:'Audio file'},
  video:{icon:page('#ea4335','<path d="M9.4 11.2l5.4 3.1-5.4 3.1z" fill="#ea4335"/>'),color:'#ea4335',label:'Video file'},
  image:{icon:'<svg class="big" viewBox="0 0 24 24" fill="#34a853"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',color:'#34a853',label:'Image'}
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------------- data ---------------- */
const G1='linear-gradient(135deg,#89f7fe,#66a6ff)', G2='linear-gradient(160deg,#f6d365,#fda085)',
      G3='linear-gradient(135deg,#3f3d56,#14131f)', G4='linear-gradient(135deg,#5f2c82,#49a09d)',
      G5='linear-gradient(135deg,#ff758c,#ff7eb3)', G6='linear-gradient(140deg,#43cea2,#185a9d)';
const FILES=[
 {n:'Projects',t:'folder',o:'me',m:'Oct 21, 2026',d:20261021,s:''},
 {n:'Media',t:'folder',o:'me',m:'Oct 18, 2026',d:20261018,s:''},
 {n:'Tax Documents 2026',t:'folder',o:'me',m:'Oct 2, 2026',d:20261002,s:''},
 {n:'Website Mockups',t:'folder',o:'Priya Sharma',m:'Oct 16, 2026',d:20261016,s:'',shared:1},
 {n:'Q4 Marketing Plan',t:'doc',o:'me',m:'Oct 27, 2026',d:20261027,s:'',star:1,sug:'You · Edited 2 hours ago'},
 {n:'Revenue Forecast',t:'sheet',o:'me',m:'Oct 26, 2026',d:20261026,s:'',star:1,sug:'You · Edited yesterday'},
 {n:'Annual Report.pdf',t:'pdf',o:'me',m:'Oct 12, 2026',d:20261012,s:'4.7 MB',star:1,sug:'You · Viewed Oct 12'},
 {n:'Product Demo.mp4',t:'video',o:'me',m:'Oct 9, 2026',d:20261009,s:'128 MB',g:G3,dur:'4:31',sug:'You · Viewed Oct 10'},
 {n:'Product Launch',t:'slide',o:'me',m:'Oct 25, 2026',d:20261025,s:''},
 {n:'Team Offsite Notes',t:'doc',o:'Ava Rodriguez',m:'Oct 24, 2026',d:20261024,s:'',shared:1},
 {n:'Budget 2026',t:'sheet',o:'me',m:'Oct 20, 2026',d:20261020,s:''},
 {n:'Conference Keynote',t:'slide',o:'me',m:'Oct 15, 2026',d:20261015,s:''},
 {n:'IMG_4821.jpg',t:'image',o:'me',m:'Oct 19, 2026',d:20261019,s:'3.2 MB',g:G1},
 {n:'Sunset over the bay.png',t:'image',o:'me',m:'Oct 11, 2026',d:20261011,s:'5.8 MB',g:G2},
 {n:'Brand shoot selects.jpg',t:'image',o:'me',m:'Oct 8, 2026',d:20261008,s:'7.1 MB',g:G6},
 {n:'Demo Reel.mp4',t:'video',o:'me',m:'Oct 5, 2026',d:20261005,s:'246 MB',g:G4,dur:'2:08'},
 {n:'Music mix v3.mp3',t:'audio',o:'me',m:'Oct 6, 2026',d:20261006,s:'8.4 MB'},
 {n:'assets-backup.zip',t:'zip',o:'me',m:'Oct 3, 2026',d:20261003,s:'62 MB'},
 {n:'meeting-notes.txt',t:'text',o:'me',m:'Oct 1, 2026',d:20261001,s:'12 KB'},
 {n:'Brand Guidelines.pdf',t:'pdf',o:'Priya Sharma',m:'Oct 23, 2026',d:20261023,s:'12.4 MB',shared:1,star:1},
 {n:'Sprint Board',t:'sheet',o:'Marcus Lee',m:'Oct 22, 2026',d:20261022,s:'',shared:1},
 {n:'Onboarding Checklist',t:'doc',o:'Ava Rodriguez',m:'Oct 17, 2026',d:20261017,s:'',shared:1},
 {n:'Old Resume.docx',t:'doc',o:'me',m:'Sep 12, 2026',d:20260912,s:'86 KB',trash:1},
 {n:'draft-v1.pptx',t:'slide',o:'me',m:'Aug 30, 2026',d:20260830,s:'14 MB',trash:1},
 {n:'temp-screenshot.png',t:'image',o:'me',m:'Aug 22, 2026',d:20260822,s:'1.1 MB',trash:1,g:G5}
];
const TITLES={drive:'My Drive',shared:'Shared with me',recent:'Recent',starred:'Starred',trash:'Trash'};
let view='grid', section='drive', query='', sortAsc=false, sel=null;

/* ---------------- rendering ---------------- */
function currentList(){
  let f=FILES.filter(x=>{
    if(section==='trash') return x.trash;
    if(x.trash) return false;
    if(section==='shared') return x.shared;
    if(section==='starred') return x.star;
    return true;
  });
  if(query) f=f.filter(x=>x.n.toLowerCase().includes(query));
  if(section==='recent') f=[...f].sort((a,b)=>b.d-a.d);
  else f=[...f].sort((a,b)=> sortAsc ? b.n.localeCompare(a.n) : a.n.localeCompare(b.n));
  return f;
}
function mini(f){
  if(f.t==='video') return '<span class="thumbmini" style="background:'+(f.g||G1)+'"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
  if(f.t==='image') return '<span class="thumbmini" style="background:'+(f.g||G1)+'"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></span>';
  const c=TYPE[f.t]; return c.icon.replace('class="big"','style="width:24px;height:24px"');
}
function nameCell(f){
  return '<span class="c-name">'+mini(f)+
    '<span class="fname">'+esc(f.n)+'</span>'+
    (f.star?'<svg class="star" viewBox="0 0 24 24">'+ICONS.star+'</svg>':'')+'</span>';
}
function render(){
  const list=currentList();
  $("#viewTitle").childNodes[0].nodeValue=TITLES[section]+(query?'':'');
  $("#btnGrid").classList.toggle('on',view==='grid');
  $("#btnList").classList.toggle('on',view==='list');
  $("#sugWrap").hidden=!(section==='drive'&&!query);
  if(section==='drive'&&!query) renderSug();
  const el=$("#content");
  if(!list.length){ el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24">'+(section==='trash'?ICONS.trash:ICONS.folder)+'</svg>'+(query?'No results for “'+esc(query)+'”':(section==='trash'?'Trash is empty':'Nothing here'))+'</div>'; return; }
  if(view==='list'){
    el.innerHTML='<div class="list"><div class="lrow lhead"><span class="c-name" id="sortName">Name <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></span><span class="c-owner">Owner</span><span class="c-mod">Modified</span><span class="c-size">File size</span><span></span></div>'+
      list.map((f,i)=>'<div class="lrow'+(sel===i?' sel':'')+'" data-i="'+i+'">'+nameCell(f)+
      '<span class="c-owner">'+(f.o==='me'?'me':esc(f.o))+'</span><span class="c-mod">'+f.m+'</span><span class="c-size">'+(f.s||'—')+'</span>'+
      '<span class="c-act"><button class="ibtn" data-more="'+i+'"><svg viewBox="0 0 24 24">'+ICONS.more+'</svg></button></span></div>').join('')+'</div>';
  }else{
    el.innerHTML='<div class="grid">'+list.map((f,i)=>{
      const c=TYPE[f.t];
      const pv=(f.g)?'<div class="gthumb" style="background:'+f.g+'">'+
          (f.t==='video'?'<span class="play"><svg viewBox="0 0 24 24">'+ICONS.play+'</svg></span><span class="dur">'+f.dur+'</span>':'<span class="play"><svg viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></span>')+
        '</div>'
        :'<div class="gthumb">'+c.icon+'</div>';
      return '<div class="gcard'+(sel===i?' sel':'')+'" data-i="'+i+'">'+pv+
        '<div class="gname"><span style="overflow:hidden;text-overflow:ellipsis">'+esc(f.n)+'</span>'+(f.star?'<svg class="star" viewBox="0 0 24 24">'+ICONS.star+'</svg>':'')+'</div>'+
        '<div class="gmeta">'+(f.o==='me'?'me':esc(f.o))+' · '+f.m+'</div></div>';
    }).join('')+'</div>';
  }
}
function renderSug(){
  const s=FILES.filter(f=>f.sug&&!f.trash);
  $("#sugRow").innerHTML=s.map((f,i)=>{
    const c=TYPE[f.t];
    const pv=f.g?'<div class="pv" style="background:'+f.g+'">'+(f.t==='video'?'<span class="play"><svg viewBox="0 0 24 24">'+ICONS.play+'</svg></span><span class="dur">'+f.dur+'</span>':'')+'</div>'
      :'<div class="pv">'+c.icon+'</div>';
    return '<div class="sug" data-name="'+esc(f.n)+'">'+pv+'<div class="nm">'+esc(f.n)+'</div><div class="mt">'+esc(f.sug)+'</div></div>';
  }).join('');
}
function fileByName(n){ return FILES.find(f=>f.n===n); }

/* ---------------- interactions ---------------- */
function snack(msg){ const s=$("#snack"); s.textContent=msg; s.classList.add("on"); clearTimeout(s._t); s._t=setTimeout(()=>s.classList.remove("on"),2600); }
function hideMenus(){ $$(".menu").forEach(m=>m.classList.remove("on")); }
function showMenu(id,anchor,align){
  hideMenus(); const m=$("#"+id); m.classList.add("on");
  const r=anchor.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  let x=align==='right'?r.right-mw:r.left, y=r.bottom+6;
  if(y+mh>innerHeight-8) y=Math.max(8,r.top-mh-6);
  m.style.left=Math.max(8,Math.min(x,innerWidth-mw-8))+'px'; m.style.top=y+'px';
}
function openDetails(f){
  const d=$("#details");
  if(!f){ $("#dtBody").innerHTML='<div class="dl"><div class="row"><span class="k">Storage</span><span class="v">4.1 GB of 15 GB used</span></div><div class="row"><span class="k">Tip</span><span class="v">Select a file to see its details.</span></div></div>'; d.classList.add("on"); return; }
  const c=TYPE[f.t];
  const hero=f.g?'<div class="dt-hero" style="background:'+f.g+'"></div>':'<div class="dt-hero">'+c.icon+'</div>';
  $("#dtBody").innerHTML=hero+'<div class="dl">'+
    '<div class="row"><span class="k">Type</span><span class="v">'+(c.label||'Folder')+'</span></div>'+
    '<div class="row"><span class="k">Owner</span><span class="v">'+(f.o==='me'?'me':esc(f.o))+'</span></div>'+
    '<div class="row"><span class="k">Modified</span><span class="v">'+f.m+'</span></div>'+
    '<div class="row"><span class="k">Size</span><span class="v">'+(f.s||'—')+'</span></div>'+
    '<div class="row"><span class="k">Location</span><span class="v">My Drive'+(f.shared?' · Shared with me':'')+'</span></div>'+
    '</div>';
  d.classList.add("on");
}
function openPreview(f){
  const c=TYPE[f.t];
  $("#mdName").textContent=f.n;
  const body=f.g?'<div style="width:100%;height:380px;border-radius:8px;background:'+f.g+';display:flex;align-items:center;justify-content:center">'+(f.t==='video'?'<svg viewBox="0 0 24 24" style="width:90px;height:90px;fill:rgba(255,255,255,.92);filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">'+ICONS.play+'</svg>':'')+'</div>'
    :c.icon+'<div class="hint">'+(c.label||'Folder')+' · '+(f.s||'—')+'</div>';
  $("#mdPv").innerHTML=body;
  $("#modal").classList.add("on");
}
function ctxItems(f){
  if(section==='trash') return [['Restore',ICONS.restore],['Permanently delete',ICONS.trash]];
  return [['Open with',ICONS.open],['Share',ICONS.share],['Get link',ICONS.link],['-',null],['Rename',ICONS.rename],['Make a copy',ICONS.copy],['Move to',ICONS.move],['Download',ICONS.download],['-',null],['Move to trash',ICONS.trash]];
}
function bindList(){
  $$("#content [data-i]").forEach(row=>{
    row.addEventListener('click',e=>{
      if(e.target.closest('[data-more]')) return;
      sel=+row.dataset.i; render();
      if($("#details").classList.contains("on")) openDetails(currentList()[sel]);
    });
    row.addEventListener('dblclick',()=>{
      const f=currentList()[+row.dataset.i];
      if(f.t==='folder') snack('Opening “'+f.n+'”'); else openPreview(f);
    });
    row.addEventListener('contextmenu',e=>{
      e.preventDefault(); sel=+row.dataset.i; render();
      const f=currentList()[sel], m=$("#ctxMenu");
      m.innerHTML=ctxItems(f).map(it=>it[1]?'<button class="mi" data-demo="'+it[0]+'"><svg viewBox="0 0 24 24">'+it[1]+'</svg>'+it[0]+'</button>':'<div class="sep"></div>').join('');
      hideMenus(); m.classList.add('on');
      m.style.left=Math.min(e.clientX,innerWidth-m.offsetWidth-8)+'px';
      m.style.top=Math.min(e.clientY,innerHeight-m.offsetHeight-8)+'px';
    });
    const more=row.querySelector('[data-more]');
    if(more) more.addEventListener('click',e=>{
      e.stopPropagation(); sel=+row.dataset.i; render();
      const f=currentList()[sel], m=$("#ctxMenu");
      m.innerHTML=ctxItems(f).map(it=>it[1]?'<button class="mi" data-demo="'+it[0]+'"><svg viewBox="0 0 24 24">'+it[1]+'</svg>'+it[0]+'</button>':'<div class="sep"></div>').join('');
      showMenu('ctxMenu',more,'right');
    });
  });
  $$("#content .sug, #content .gcard").forEach(()=>{});
}
// rebind after each render
const _render=render;
render=function(){ _render(); bindList();
  $$("#sugRow .sug").forEach(s=>{ if(s.dataset.bound) return; s.dataset.bound=1;
    s.addEventListener('click',()=>openPreview(fileByName(s.dataset.name))); });
  const sn=$("#sortName"); if(sn) sn.addEventListener('click',()=>{sortAsc=!sortAsc;render();});
};

/* nav */
$$(".nav-item").forEach(b=>b.addEventListener('click',()=>{
  $$(".nav-item").forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); section=b.dataset.view; sel=null; query=""; $("#q").value=""; $("#clearBtn").classList.remove('on');
  render(); $("#details").classList.remove('on'); closeDrawer();
}));
/* view toggle */
$("#btnGrid").addEventListener('click',()=>{view='grid';render()});
$("#btnList").addEventListener('click',()=>{view='list';render()});
$("#btnInfo").addEventListener('click',()=>{ const d=$("#details"); if(d.classList.contains('on')) d.classList.remove('on'); else openDetails(sel!==null?currentList()[sel]:null); });
$("#dtClose").addEventListener('click',()=>$("#details").classList.remove('on'));
/* search */
$("#q").addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); $("#clearBtn").classList.toggle('on',!!query); sel=null; render(); });
$("#clearBtn").addEventListener('click',()=>{ $("#q").value=""; query=""; $("#clearBtn").classList.remove('on'); render(); $("#q").focus(); });
$("#micBtn").addEventListener('click',()=>snack('Voice search is not available in this demo'));
/* menus */
$("#newBtn").addEventListener('click',e=>{e.stopPropagation();showMenu('newMenu',$("#newBtn"))});
$("#setBtn").addEventListener('click',e=>{e.stopPropagation();showMenu('setMenu',$("#setBtn"),'right')});
$("#avatarBtn").addEventListener('click',e=>{e.stopPropagation();showMenu('avatarMenu',$("#avatarBtn"),'right')});
$("#helpBtn").addEventListener('click',()=>snack('Help is not available in this demo'));
$("#appsBtn").addEventListener('click',()=>snack('Google apps'));
$("#viewTitle").addEventListener('click',()=>snack('Section switcher'));
document.addEventListener('click',e=>{ if(!e.target.closest('.menu')) hideMenus(); });
document.addEventListener('contextmenu',e=>{ if(!e.target.closest('[data-i]')&&!e.target.closest('.menu')) hideMenus(); });
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-demo]'); if(d){ snack(d.dataset.demo+': demo only'); hideMenus(); }
});
/* modal */
$("#mdClose").addEventListener('click',()=>$("#modal").classList.remove('on'));
$("#modal").addEventListener('click',e=>{ if(e.target.id==='modal') $("#modal").classList.remove('on'); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($("#modal").classList.contains('on')) $("#modal").classList.remove('on');
    else if($$(".menu.on").length) hideMenus();
    else if(!opDone) endOpener();
  }
});
/* mobile drawer */
function closeDrawer(){ $("#side").classList.remove('open'); $("#drawerOv").classList.remove('on'); }
$("#menuBtn").addEventListener('click',()=>{
  if(innerWidth>960){ snack('Main menu'); return; }
  $("#side").classList.toggle('open'); $("#drawerOv").classList.toggle('on');
});
$("#drawerOv").addEventListener('click',closeDrawer);
/* logo click resets */
$("#logo").addEventListener('click',e=>{e.preventDefault();section='drive';query="";$("#q").value="";$$(".nav-item").forEach(x=>x.classList.toggle('active',x.dataset.view==='drive'));render()});

render();
</script>
